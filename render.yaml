services:
  - type: web
    name: breast-cancer-ai
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: NODE_VERSION
        value: 18.17.1
